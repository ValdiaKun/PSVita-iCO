name: vita-toolchain-probe

on:
  push:
    branches: [vita/feasibility-audit]
    paths:
      - ".github/workflows/vita-toolchain-probe.yml"
      - "docs/PSVITA_PORTING.md"
      - "port/**"
      - "tools/vita_source_audit.py"
      - "cmake/IcoSources.cmake"
      - "cmake/IcoFlags.cmake"
      - "cmake/IcoExclusions.cmake"
      - "config/link_order.pal.txt"
      - "ico2/**"
  pull_request:
    paths:
      - ".github/workflows/vita-toolchain-probe.yml"
      - "docs/PSVITA_PORTING.md"
      - "port/**"
      - "tools/vita_source_audit.py"
      - "cmake/IcoSources.cmake"
      - "cmake/IcoFlags.cmake"
      - "cmake/IcoExclusions.cmake"
      - "config/link_order.pal.txt"
      - "ico2/**"
  workflow_dispatch:

concurrency:
  group: vita-toolchain-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4

      - name: Verify VitaSDK tools and ARMv7 compiler
        shell: bash
        run: |
          set -euo pipefail
          : "${VITASDK:?VITASDK must be set by the VitaSDK container}"
          for tool in arm-vita-eabi-gcc vita-elf-create vita-make-fself vita-mksfoex vita-pack-vpk arm-vita-eabi-readelf; do
            test -x "$VITASDK/bin/$tool"
          done
          "$VITASDK/bin/arm-vita-eabi-gcc" --version

      - name: Compile an ARMv7 C probe
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/vita_probe.c" <<'EOF'
          #include <stdint.h>
          uint32_t vita_probe(uint32_t value) { return (value << 1) | (value >> 31); }
          EOF
          "$VITASDK/bin/arm-vita-eabi-gcc" \
            -std=c11 -Wall -Wextra -Werror -O2 \
            -c "$RUNNER_TEMP/vita_probe.c" \
            -o "$RUNNER_TEMP/vita_probe.o"
          file "$RUNNER_TEMP/vita_probe.o"
          header="$("$VITASDK/bin/arm-vita-eabi-readelf" -h "$RUNNER_TEMP/vita_probe.o")"
          grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
          grep -Eq 'Machine:[[:space:]]+ARM' <<< "$header"

      - name: Cross-compile portable production modules
        shell: bash
        run: |
          set -euo pipefail
          cc="$VITASDK/bin/arm-vita-eabi-gcc"
          "$cc" -std=gnu11 -Wall -Wextra -Werror -O2 \
            -I "$GITHUB_WORKSPACE/port/math" \
            -c "$GITHUB_WORKSPACE/port/math/ps2float.c" \
            -o "$RUNNER_TEMP/ico_ps2float_vita.o"
          for source in adpcm.c spu2.c spu2_sd.c spu2_tables.c volume.c mix_gain.c; do
            object="$RUNNER_TEMP/ico_${source%.c}_vita.o"
            "$cc" -std=gnu11 -Wall -Wextra -Werror -O2 \
              -I "$GITHUB_WORKSPACE/port/audio" \
              -c "$GITHUB_WORKSPACE/port/audio/$source" -o "$object"
          done
          for object in "$RUNNER_TEMP"/ico_*_vita.o; do
            header="$("$VITASDK/bin/arm-vita-eabi-readelf" -h "$object")"
            grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
            grep -Eq 'Machine:[[:space:]]+ARM' <<< "$header"
            printf 'Verified ARMv7 object: %s\n' "$object"
          done

      - name: Cross-compile native Vita audio sink and integration
        shell: bash
        run: |
          set -euo pipefail
          cc="$VITASDK/bin/arm-vita-eabi-gcc"
          root="$GITHUB_WORKSPACE"
          common_includes=(
            -I "$root"
            -I "$root/port/audio"
            -I "$root/port/game"
            -I "$root/port/platform"
            -I "$root/port/compat"
            -I "$root/port/config"
            -I "$root/port/input"
            -I "$root/port/data"
            -I "$root/port/save"
            -I "$root/port/fmv"
            -I "$root/ico2/sugipon/include"
            -I "$root/ico2/seki/include"
          )
          "$cc" -std=gnu11 -Wall -Wextra -Werror -O2 \
            "${common_includes[@]}" \
            -DICO_AUDIO_VITA=1 \
            -c "$root/port/audio/audio_host.c" \
            -o "$RUNNER_TEMP/ico_audio_host_vita.o"
          "$cc" -std=gnu11 -Wall -Wextra -Werror -O2 \
            "${common_includes[@]}" \
            -c "$root/port/audio/out_vita.c" \
            -o "$RUNNER_TEMP/ico_out_vita_vita.o"
          for object in "$RUNNER_TEMP/ico_audio_host_vita.o" "$RUNNER_TEMP/ico_out_vita_vita.o"; do
            header="$("$VITASDK/bin/arm-vita-eabi-readelf" -h "$object")"
            grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
            grep -Eq 'Machine:[[:space:]]+ARM' <<< "$header"
            printf 'Verified ARMv7 Vita audio object: %s\n' "$object"
          done

      - name: Cross-compile portable production math modules
        shell: bash
        run: |
          set -euo pipefail
          cc="$VITASDK/bin/arm-vita-eabi-gcc"
          root="$GITHUB_WORKSPACE"
          for source in cloth.c libvu0.c matrix.c matrix_drive.c matrix_stack.c quaternion.c softdouble.c; do
            object="$RUNNER_TEMP/ico_math_${source%.c}_vita.o"
            "$cc" -std=gnu11 -Wall -Wextra -Werror -O2 \
              -I "$root" \
              -I "$root/port/math" \
              -I "$root/port/compat" \
              -I "$root/ico2/seki/include" \
              -I "$root/ico2/sugipon/include" \
              -c "$root/port/math/$source" -o "$object"
            header="$("$VITASDK/bin/arm-vita-eabi-readelf" -h "$object")"
            grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
            grep -Eq 'Machine:[[:space:]]+ARM' <<< "$header"
            printf 'Verified ARMv7 math object: %s\n' "$object"
          done

      - name: Cross-compile portable production input modules
        shell: bash
        run: |
          set -euo pipefail
          cc="$VITASDK/bin/arm-vita-eabi-gcc"
          root="$GITHUB_WORKSPACE"
          for source in bindings.c input_config.c input_record.c mouse_camera.c mouse_look.c pad_host.c pad_script.c pointer.c touch.c vpad.c; do
            object="$RUNNER_TEMP/ico_input_${source%.c}_vita.o"
            "$cc" -std=gnu11 -Wall -Wextra -Wno-unused-parameter -Werror -O2 \
              -I "$root" \
              -I "$root/port/input" \
              -I "$root/port/config" \
              -I "$root/port/platform" \
              -I "$root/port/game" \
              -I "$root/port/compat" \
              -I "$root/ico2/seki/include" \
              -I "$root/ico2/sugipon/include" \
              -c "$root/port/input/$source" -o "$object"
            header="$("$VITASDK/bin/arm-vita-eabi-readelf" -h "$object")"
            grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
            grep -Eq 'Machine:[[:space:]]+ARM' <<< "$header"
            printf 'Verified ARMv7 input object: %s\n' "$object"
          done

      - name: Cross-compile native Vita controller adapter
        shell: bash
        run: |
          set -euo pipefail
          cc="$VITASDK/bin/arm-vita-eabi-gcc"
          root="$GITHUB_WORKSPACE"
          object="$RUNNER_TEMP/ico_input_vita_vita.o"
          "$cc" -std=gnu11 -Wall -Wextra -Werror -O2 \
            -I "$root/port/input" \
            -I "$root/port/platform" \
            -I "$root/port/config" \
            -I "$root/port/game" \
            -I "$root/port/compat" \
            -c "$root/port/input/input_vita.c" -o "$object"
          header="$("$VITASDK/bin/arm-vita-eabi-readelf" -h "$object")"
          grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
          grep -Eq 'Machine:[[:space:]]+ARM' <<< "$header"
          printf 'Verified ARMv7 Vita controller object: %s\n' "$object"

      - name: Configure and compile the CMake-selected Vita input object
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          build="$RUNNER_TEMP/ico-vita-input-cmake"
          deps="$RUNNER_TEMP/ico-deps"
          mkdir -p "$deps/libchdr"
          git init -q "$RUNNER_TEMP/libchdr.git"
          git -C "$RUNNER_TEMP/libchdr.git" fetch -q --depth 1 \
            https://github.com/rtissera/libchdr "refs/tags/v0.3.0"
          chdr_commit="$(git -C "$RUNNER_TEMP/libchdr.git" rev-parse 'FETCH_HEAD^{commit}')"
          test "$chdr_commit" = "93d8c239ff0d4e8d7722985992649fce12d2463b"
          git -C "$RUNNER_TEMP/libchdr.git" archive --format=tar \
            -o "$RUNNER_TEMP/libchdr.tar" "$chdr_commit"
          echo "591863ddda6c4a90192e66ac682d9f535ac9af79f2385e7c180af0b3b46e1394  $RUNNER_TEMP/libchdr.tar" \
            | sha256sum -c -
          tar -C "$deps/libchdr" -xf "$RUNNER_TEMP/libchdr.tar" \
            src include deps LICENSE.txt README.md CHANGELOG.md
          cmake -S "$root" -B "$build" \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DICO_DEPS_DIR="$deps" \
            -DICO_HEADLESS=ON \
            -DICO_LINK_EXE=OFF \
            -DICO_INPUT_VITA=ON \
            -DICO_RHI_VULKAN=OFF \
            -DICO_RHI_D3D12=OFF \
            -DICO_SHADERS_DXIL=OFF
          # Build only the selected device-layer object. The aggregate ico_input
          # target currently pulls in ico_platform/diag_host.c, which is known
          # to require unsupported POSIX ucontext APIs on Vita; that blocker is
          # separately reported by diagnostics-portability-audit.
          python3 - "$build/compile_commands.json" "$root/port/input/input_vita.c" <<'PY'
          import json
          import shlex
          import subprocess
          import sys
          from pathlib import Path

          database = Path(sys.argv[1])
          wanted = Path(sys.argv[2]).resolve()
          entries = json.loads(database.read_text(encoding="utf-8"))
          matches = [entry for entry in entries if Path(entry["file"]).resolve() == wanted]
          if len(matches) != 1:
              raise SystemExit(f"expected one CMake compile entry for {wanted}, got {len(matches)}")
          entry = matches[0]
          command = entry.get("command")
          if not command:
              raise SystemExit("CMake compile database entry has no command")
          if "ICO_INPUT_VITA=1" not in command:
              raise SystemExit("CMake did not apply ICO_INPUT_VITA=1 to the native input object")
          print("Compile command:", command, flush=True)
          subprocess.run(shlex.split(command), cwd=entry["directory"], check=True)
          print("CMake-selected Vita input object compiled successfully", flush=True)
          PY

      - name: Build and validate a minimal Vita VPK
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/vita-vpk-probe"
          mkdir -p "$probe"
          cat > "$probe/main.c" <<'EOF'
          int main(void) { return 0; }
          EOF
          cat > "$probe/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          if(NOT DEFINED CMAKE_TOOLCHAIN_FILE)
            if(DEFINED ENV{VITASDK})
              set(CMAKE_TOOLCHAIN_FILE "$ENV{VITASDK}/share/vita.toolchain.cmake" CACHE PATH "Vita toolchain")
            else()
              message(FATAL_ERROR "VITASDK is required")
            endif()
          endif()
          project(vita_vpk_probe C)
          include("$ENV{VITASDK}/share/vita.cmake" REQUIRED)
          set(VITA_APP_NAME "ICO Vita SDK Probe")
          set(VITA_TITLEID "VPRB00001")
          set(VITA_VERSION "01.00")
          add_executable(vita_vpk_probe main.c)
          vita_create_self(vita_vpk_probe.self vita_vpk_probe)
          vita_create_vpk(vita_vpk_probe.vpk ${VITA_TITLEID} vita_vpk_probe.self
            VERSION ${VITA_VERSION}
            NAME ${VITA_APP_NAME}
          )
          EOF
          cmake -S "$probe" -B "$probe/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$probe/build" --parallel 2
          self="$probe/build/vita_vpk_probe.self"
          vpk="$probe/build/vita_vpk_probe.vpk"
          test -s "$self"
          test -s "$vpk"
          file "$self" "$vpk"
          python3 - "$vpk" <<'PY'
          import sys
          import zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as package:
              bad = package.testzip()
              if bad is not None:
                  raise SystemExit(f"corrupt VPK member: {bad}")
              names = package.namelist()
              if "eboot.bin" not in names or "sce_sys/param.sfo" not in names:
                  raise SystemExit(f"required VPK members missing: {names}")
              print("VPK archive verified:", ", ".join(names))
          PY

      - name: Upload minimal SDK smoke-test package
        uses: actions/upload-artifact@v4
        with:
          name: vita-sdk-smoke-probe-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vita-vpk-probe/build/vita_vpk_probe.self
            ${{ runner.temp }}/vita-vpk-probe/build/vita_vpk_probe.vpk
          retention-days: 7
          if-no-files-found: error

      - name: Cross-compile Vita renderer translation units
        shell: bash
        run: |
          set -euo pipefail
          cc="$VITASDK/bin/arm-vita-eabi-gcc"
          root="$GITHUB_WORKSPACE"
          for source in vu1_ref.c vu1_normal.c vu1_scissor.c vu1_cluster.c vu1_mesh.c vu1_particle.c; do
            object="$RUNNER_TEMP/ico_vu1_${source%.c}_vita.o"
            "$cc" -std=gnu11 -Wall -Wextra -Werror -O2 \
              -fno-strict-aliasing -ffp-contract=off -fno-fast-math \
              -I "$root/port/math" \
              -I "$root/port/render/vu1_ref" \
              -c "$root/port/render/vu1_ref/$source" -o "$object"
            header="$("$VITASDK/bin/arm-vita-eabi-readelf" -h "$object")"
            grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
            grep -Eq 'Machine:[[:space:]]+ARM' <<< "$header"
            printf 'Verified ARMv7 CPU renderer object: %s\n' "$object"
          done
          for source in xxh3.c texpack_name.c; do
            object="$RUNNER_TEMP/ico_render_${source%.c}_vita.o"
            "$cc" -std=gnu11 -Wall -Wextra -Werror -O2 \
              -fno-strict-aliasing -ffp-contract=off -fno-fast-math \
              -I "$root/port/math" \
              -I "$root/port/render" \
              -c "$root/port/render/$source" -o "$object"
            header="$("$VITASDK/bin/arm-vita-eabi-readelf" -h "$object")"
            grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
            grep -Eq 'Machine:[[:space:]]+ARM' <<< "$header"
            printf 'Verified ARMv7 render support object: %s\n' "$object"
          done
          # Compile the core CPU-side renderer implementation too. This does
          # not link the RHI or imply a working Vita GPU backend.
          for source in rd_frame.c rd_interp.c rd_mesh.c rd_perf.c rd_pipeline.c rd_tex.c; do
            object="$RUNNER_TEMP/ico_render_core_${source%.c}_vita.o"
            "$cc" -std=gnu11 -Wall -Wextra -Werror -O2 \
              -fno-strict-aliasing -ffp-contract=off -fno-fast-math \
              -I "$root/port/math" \
              -I "$root/port/render" \
              -I "$root/port/render/vu1_ref" \
              -I "$root/port/rhi" \
              -I "$root/port/shaders" \
              -I "$root/port/fmv" \
              -I "$root/port/platform" \
              -I "$root/port/compat" \
              -I "$root/port/json" \
              -I "$root/port/miniz" \
              -c "$root/port/render/$source" -o "$object"
            header="$("$VITASDK/bin/arm-vita-eabi-readelf" -h "$object")"
            grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
            grep -Eq 'Machine:[[:space:]]+ARM' <<< "$header"
            printf 'Verified ARMv7 render core object: %s\n' "$object"
          done
          # Extend coverage to the recording/replay, presentation, and post-process
          # units that use the RHI interface but remain compile-only here.
          for source in rd_core.c rd_dump.c rd_post.c rd_shadow.c rd_water.c rd_present.c rd_blur.c rd_crt.c rd_png.c; do
            object="$RUNNER_TEMP/ico_render_core_${source%.c}_vita.o"
            "$cc" -std=gnu11 -Wall -Wextra -Werror -O2 \
              -fno-strict-aliasing -ffp-contract=off -fno-fast-math \
              -I "$root/port/math" \
              -I "$root/port/render" \
              -I "$root/port/render/vu1_ref" \
              -I "$root/port/rhi" \
              -I "$root/port/shaders" \
              -I "$root/port/fmv" \
              -I "$root/port/platform" \
              -I "$root/port/compat" \
              -I "$root/port/json" \
              -I "$root/port/miniz" \
              -c "$root/port/render/$source" -o "$object"
            header="$("$VITASDK/bin/arm-vita-eabi-readelf" -h "$object")"
            grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
            grep -Eq 'Machine:[[:space:]]+ARM' <<< "$header"
            printf 'Verified ARMv7 render implementation object: %s\n' "$object"
          done

      - name: Cross-compile portable platform services
        shell: bash
        run: |
          set -euo pipefail
          cc="$VITASDK/bin/arm-vita-eabi-gcc"
          root="$GITHUB_WORKSPACE"
          for source in arena.c assert_host.c pace_policy.c hotkeys.c host_fs.c host_config.c fpenv.c clock.c hwregs.c vsync_hooks.c fiber.c sched.c kernel_host.c window_lifecycle.c; do
            object="$RUNNER_TEMP/ico_platform_${source%.c}_vita.o"
            extra_flags=()
            if [[ "$source" == "fiber.c" ]]; then
              # Exercise the Vita allocator selection even if the compiler
              # version does not expose __vita__ as a predefined macro.
              extra_flags+=(-DICO_VITA_TARGET=1)
            fi
            "$cc" -std=gnu11 -Wall -Wextra -Werror -O2 \
              -fno-strict-aliasing -ffp-contract=off -fno-fast-math \
              "${extra_flags[@]}" \
              -I "$root/port/platform" \
              -I "$root/port/compat" \
              -c "$root/port/platform/$source" -o "$object"
            header="$("$VITASDK/bin/arm-vita-eabi-readelf" -h "$object")"
            grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
            grep -Eq 'Machine:[[:space:]]+ARM' <<< "$header"
            printf 'Verified ARMv7 platform service object: %s\n' "$object"
          done

  vitagl-renderer-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned vitaGL source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Rinnegatamante/vitaGL.git "$RUNNER_TEMP/vitaGL"
          git -C "$RUNNER_TEMP/vitaGL" checkout dca4b9d143290d78ec043131a19be36c78cdc7b5
          test "$(git -C "$RUNNER_TEMP/vitaGL" rev-parse HEAD)" = "dca4b9d143290d78ec043131a19be36c78cdc7b5"

      - name: Build and install pinned vitaGL library
        shell: bash
        run: |
          set -euo pipefail
          make -C "$RUNNER_TEMP/vitaGL" install -j2
          test -s "$VITASDK/arm-vita-eabi/lib/libvitaGL.a"
          test -s "$VITASDK/arm-vita-eabi/include/vitaGL.h"

      - name: Build real OpenGL draw sample into a VPK
        shell: bash
        run: |
          set -euo pipefail
          sample="$RUNNER_TEMP/vitaGL/samples/immediate_mode"
          make -C "$sample" -j2
          vpk="$sample/immediate_mode.vpk"
          test -s "$vpk"
          python3 - "$vpk" <<'PY'
          import sys
          import zipfile

          path = sys.argv[1]
          required = {"eboot.bin", "sce_sys/param.sfo"}
          with zipfile.ZipFile(path) as package:
              names = set(package.namelist())
          missing = required - names
          if missing:
              raise SystemExit(f"VPK missing required entries: {sorted(missing)}")
          print("\\n".join(sorted(names)))
          PY
          mkdir -p "$RUNNER_TEMP/vitaGL-artifact"
          cp "$vpk" "$RUNNER_TEMP/vitaGL-artifact/vitaGL-immediate-mode-probe.vpk"
          sha256sum "$RUNNER_TEMP/vitaGL-artifact/vitaGL-immediate-mode-probe.vpk"

      - name: Upload vitaGL graphics feasibility package
        uses: actions/upload-artifact@v4
        with:
          name: vitaGL-immediate-mode-probe-vpk
          path: ${{ runner.temp }}/vitaGL-artifact/vitaGL-immediate-mode-probe.vpk
          if-no-files-found: error
          retention-days: 7

  diagnostics-portability-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4

      - name: Confirm desktop diagnostic implementation is not Vita-compilable unchanged
        shell: bash
        run: |
          set -euo pipefail
          cc="$VITASDK/bin/arm-vita-eabi-gcc"
          root="$GITHUB_WORKSPACE"
          log="$RUNNER_TEMP/diag_host_vita_probe.log"
          if "$cc" -std=gnu11 -Wall -Wextra -Werror -O2 \
              -I "$root/port/platform" -I "$root/port/compat" \
              -c "$root/port/platform/diag_host.c" \
              -o "$RUNNER_TEMP/diag_host_vita_probe.o" >"$log" 2>&1; then
            echo "Unexpected result: diag_host.c compiled unchanged for Vita." >&2
            exit 1
          fi
          cat "$log"
          if ! grep -Eiq 'pthread\.h|ucontext\.h|pthread_getattr_np|pthread_kill|sigaltstack|/proc/self/status|dladdr' "$log"; then
            echo "Compilation failed, but not for a known desktop-only diagnostic dependency." >&2
            exit 1
          fi
          echo "Confirmed: desktop diagnostics remain isolated from the Vita source selection."

      - name: Cross-compile Vita diagnostics backend
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          cc="$VITASDK/bin/arm-vita-eabi-gcc"
          object="$RUNNER_TEMP/diag_vita.o"
          "$cc" -std=gnu11 -Wall -Wextra -Werror -O2 \
            -I "$root/port/platform" -I "$root/port/compat" \
            -c "$root/port/platform/diag_vita.c" -o "$object"
          header="$("$VITASDK/bin/arm-vita-eabi-readelf" -h "$object")"
          grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
          grep -Eq 'Machine:[[:space:]]+ARM' <<< "$header"
          echo "Verified ARMv7 Vita diagnostics object: $object"

  vita-arena-mock-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compile Vita arena branch against mocked sysmem API
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          cc -std=gnu11 -Wall -Wextra -Werror -O2 -D__vita__ \
            -I "$root/port/platform/test/mock" \
            -I "$root/port/platform" \
            "$root/port/platform/arena.c" \
            "$root/port/platform/test/arena_vita_test.c" \
            -o "$RUNNER_TEMP/arena_vita_test"

      - name: Verify allocation, alignment, zero-fill, and retry behavior
        shell: bash
        run: |
          set -euo pipefail
          test_bin="$RUNNER_TEMP/arena_vita_test"
          "$test_bin" success
          "$test_bin" alloc-fail
          "$test_bin" base-fail

      - name: Build and run Vita diagnostics mock regression
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          cc -std=gnu11 -Wall -Wextra -Werror -O2 \
            -I "$root/port/platform/test/mock" \
            -I "$root/port/platform" \
            "$root/port/platform/diag_vita.c" \
            "$root/port/platform/test/diag_vita_test.c" \
            -lm -o "$RUNNER_TEMP/diag_vita_test"
          (cd "$RUNNER_TEMP" && ./diag_vita_test)

  softdouble-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build and run Vita audio block regression
        shell: bash
        run: |
          set -euo pipefail
          cc -std=gnu11 -Wall -Wextra -Werror -O2 \
            -I "$GITHUB_WORKSPACE/port/audio/test/mock" \
            -I "$GITHUB_WORKSPACE/port/audio" \
            "$GITHUB_WORKSPACE/port/audio/test/out_vita_test.c" \
            "$GITHUB_WORKSPACE/port/audio/out_vita.c" \
            "$GITHUB_WORKSPACE/port/audio/volume.c" \
            -o "$RUNNER_TEMP/vita_audio_buffer_test"
          "$RUNNER_TEMP/vita_audio_buffer_test"

      - name: Build and run Vita controller mapping regression
        shell: bash
        run: |
          set -euo pipefail
          cc -std=gnu11 -Wall -Wextra -Werror -O2 \
            -I "$GITHUB_WORKSPACE/port/input/test/mock" \
            -I "$GITHUB_WORKSPACE/port/input" \
            "$GITHUB_WORKSPACE/port/input/test/input_vita_test.c" \
            "$GITHUB_WORKSPACE/port/input/input_vita.c" \
            -o "$RUNNER_TEMP/vita_input_test"
          "$RUNNER_TEMP/vita_input_test"

      - name: Configure isolated host regression test
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/ico-softdouble-project"
          mkdir -p "$project"
          cat > "$project/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.25)
          project(ico_softdouble_regression C)
          enable_testing()
          set(ICO_ROOT "" CACHE PATH "ICO repository root")
          set(dpbit "${CMAKE_CURRENT_BINARY_DIR}/dpbit")
          add_custom_command(
            OUTPUT "${dpbit}/dp-bit.c" "${dpbit}/fp-bit.c" "${dpbit}/libgcc2.h"
            COMMAND "${CMAKE_COMMAND}" "-DSRC=${ICO_ROOT}/sce/libgcc" "-DDST=${dpbit}"
                    -P "${ICO_ROOT}/port/math/test/dpbit_harness.cmake"
            DEPENDS "${ICO_ROOT}/sce/libgcc/dp-bit.c" "${ICO_ROOT}/sce/libgcc/fp-bit.c"
                    "${ICO_ROOT}/sce/libgcc/libgcc2.h"
                    "${ICO_ROOT}/port/math/test/dpbit_harness.cmake"
            VERBATIM)
          add_library(ico_dpbit_ref STATIC "${dpbit}/dp-bit.c" "${dpbit}/fp-bit.c")
          target_compile_definitions(ico_dpbit_ref PRIVATE
            dpadd=ref_dpadd dpsub=ref_dpsub dpmul=ref_dpmul dpdiv=ref_dpdiv dpcmp=ref_dpcmp
            litodp=ref_litodp dptoli=ref_dptoli dptoul=ref_dptoul __negdf2=ref___negdf2
            __make_dp=ref___make_dp dptofp=ref_dptofp __pack_d=ref___pack_d
            __unpack_d=ref___unpack_d _fpadd_parts=ref__fpadd_parts
            __fpcmp_parts_d=ref___fpcmp_parts_d fpadd=ref_fpadd fpsub=ref_fpsub
            fpmul=ref_fpmul fpdiv=ref_fpdiv fpcmp=ref_fpcmp sitofp=ref_sitofp
            fptosi=ref_fptosi fptoui=ref_fptoui __negsf2=ref___negsf2
            __make_fp=ref___make_fp fptodp=ref_fptodp __pack_f=ref___pack_f
            __unpack_f=ref___unpack_f __fpcmp_parts_f=ref___fpcmp_parts_f)
          target_compile_options(ico_dpbit_ref PRIVATE -w -fno-builtin -fno-strict-aliasing)
          add_executable(softdouble_test
            "${ICO_ROOT}/port/math/softdouble.c"
            "${ICO_ROOT}/port/math/test/softdouble_test.c")
          target_include_directories(softdouble_test PRIVATE "${ICO_ROOT}/port/math")
          target_compile_options(softdouble_test PRIVATE -std=gnu11 -fno-strict-aliasing
            -fwrapv -ffp-contract=off -fno-fast-math -fsigned-char -fno-common -fgnu89-inline)
          target_link_libraries(softdouble_test PRIVATE ico_dpbit_ref m)
          add_test(NAME softdouble COMMAND softdouble_test)
          EOF
          cmake -S "$project" -B "$project/build" -G Ninja -DICO_ROOT="$GITHUB_WORKSPACE"

      - name: Build and run bit-exact softdouble regression
        run: |
          cmake --build "$RUNNER_TEMP/ico-softdouble-project/build" --target softdouble_test --parallel 2
          ctest --test-dir "$RUNNER_TEMP/ico-softdouble-project/build" --output-on-failure -R softdouble


  game-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4

      - name: Cross-compile every host game translation unit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/vita_source_audit.py \
            --root "$GITHUB_WORKSPACE" \
            --cc "$VITASDK/bin/arm-vita-eabi-gcc" \
            --output-dir "$RUNNER_TEMP/vita-game-objects" \
            --report "$RUNNER_TEMP/vita-source-audit.json"

      - name: Upload source-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vita-game-source-audit
          path: ${{ runner.temp }}/vita-source-audit.json
          retention-days: 7
          if-no-files-found: warn
