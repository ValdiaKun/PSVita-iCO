name: vita-toolchain-probe

on:
  push:
    branches: [vita/feasibility-audit]
    paths:
      - ".github/workflows/vita-toolchain-probe.yml"
      - "docs/PSVITA_PORTING.md"
      - "port/math/**"
      - "port/audio/**"
      - "port/render/**"
      - "port/render/**"
      - "tools/vita_source_audit.py"
      - "cmake/IcoSources.cmake"
      - "cmake/IcoFlags.cmake"
      - "cmake/IcoExclusions.cmake"
      - "config/link_order.pal.txt"
      - "ico2/**"
  pull_request:
    paths:
      - ".github/workflows/vita-toolchain-probe.yml"
      - "docs/PSVITA_PORTING.md"
      - "port/math/**"
      - "port/audio/**"
      - "port/render/**"
      - "tools/vita_source_audit.py"
      - "cmake/IcoSources.cmake"
      - "cmake/IcoFlags.cmake"
      - "cmake/IcoExclusions.cmake"
      - "config/link_order.pal.txt"
      - "ico2/**"
  workflow_dispatch:

concurrency:
  group: vita-toolchain-probe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sdk-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4

      - name: Verify VitaSDK tools and ARMv7 compiler
        shell: bash
        run: |
          set -euo pipefail
          : "${VITASDK:?VITASDK must be set by the VitaSDK container}"
          for tool in arm-vita-eabi-gcc vita-elf-create vita-make-fself vita-mksfoex vita-pack-vpk arm-vita-eabi-readelf; do
            test -x "$VITASDK/bin/$tool"
          done
          "$VITASDK/bin/arm-vita-eabi-gcc" --version

      - name: Compile an ARMv7 C probe
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/vita_probe.c" <<'EOF'
          #include <stdint.h>
          uint32_t vita_probe(uint32_t value) { return (value << 1) | (value >> 31); }
          EOF
          "$VITASDK/bin/arm-vita-eabi-gcc" \
            -std=c11 -Wall -Wextra -Werror -O2 \
            -c "$RUNNER_TEMP/vita_probe.c" \
            -o "$RUNNER_TEMP/vita_probe.o"
          file "$RUNNER_TEMP/vita_probe.o"
          header="$("$VITASDK/bin/arm-vita-eabi-readelf" -h "$RUNNER_TEMP/vita_probe.o")"
          grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
          grep -Eq 'Machine:[[:space:]]+ARM' <<< "$header"

      - name: Cross-compile portable production modules
        shell: bash
        run: |
          set -euo pipefail
          cc="$VITASDK/bin/arm-vita-eabi-gcc"
          "$cc" -std=gnu11 -Wall -Wextra -Werror -O2 \
            -I "$GITHUB_WORKSPACE/port/math" \
            -c "$GITHUB_WORKSPACE/port/math/ps2float.c" \
            -o "$RUNNER_TEMP/ico_ps2float_vita.o"
          for source in adpcm.c spu2.c spu2_sd.c spu2_tables.c volume.c mix_gain.c; do
            object="$RUNNER_TEMP/ico_${source%.c}_vita.o"
            "$cc" -std=gnu11 -Wall -Wextra -Werror -O2 \
              -I "$GITHUB_WORKSPACE/port/audio" \
              -c "$GITHUB_WORKSPACE/port/audio/$source" -o "$object"
          done
          for object in "$RUNNER_TEMP"/ico_*_vita.o; do
            header="$("$VITASDK/bin/arm-vita-eabi-readelf" -h "$object")"
            grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
            grep -Eq 'Machine:[[:space:]]+ARM' <<< "$header"
            printf 'Verified ARMv7 object: %s\n' "$object"
          done

      - name: Cross-compile portable production math modules
        shell: bash
        run: |
          set -euo pipefail
          cc="$VITASDK/bin/arm-vita-eabi-gcc"
          root="$GITHUB_WORKSPACE"
          for source in cloth.c libvu0.c matrix.c matrix_drive.c matrix_stack.c quaternion.c softdouble.c; do
            object="$RUNNER_TEMP/ico_math_${source%.c}_vita.o"
            "$cc" -std=gnu11 -Wall -Wextra -Werror -O2 \
              -I "$root" \
              -I "$root/port/math" \
              -I "$root/port/compat" \
              -I "$root/ico2/seki/include" \
              -I "$root/ico2/sugipon/include" \
              -c "$root/port/math/$source" -o "$object"
            header="$("$VITASDK/bin/arm-vita-eabi-readelf" -h "$object")"
            grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
            grep -Eq 'Machine:[[:space:]]+ARM' <<< "$header"
            printf 'Verified ARMv7 math object: %s\n' "$object"
          done

      - name: Cross-compile portable production input modules
        shell: bash
        run: |
          set -euo pipefail
          cc="$VITASDK/bin/arm-vita-eabi-gcc"
          root="$GITHUB_WORKSPACE"
          for source in bindings.c input_record.c mouse_camera.c mouse_look.c pad_host.c pad_script.c pointer.c touch.c vpad.c; do
            object="$RUNNER_TEMP/ico_input_${source%.c}_vita.o"
            "$cc" -std=gnu11 -Wall -Wextra -Wno-unused-parameter -Werror -O2 \
              -I "$root" \
              -I "$root/port/input" \
              -I "$root/port/platform" \
              -I "$root/port/game" \
              -I "$root/port/compat" \
              -I "$root/ico2/seki/include" \
              -I "$root/ico2/sugipon/include" \
              -c "$root/port/input/$source" -o "$object"
            header="$("$VITASDK/bin/arm-vita-eabi-readelf" -h "$object")"
            grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
            grep -Eq 'Machine:[[:space:]]+ARM' <<< "$header"
            printf 'Verified ARMv7 input object: %s\n' "$object"
          done

      - name: Build and validate a minimal Vita VPK
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/vita-vpk-probe"
          mkdir -p "$probe"
          cat > "$probe/main.c" <<'EOF'
          int main(void) { return 0; }
          EOF
          cat > "$probe/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          if(NOT DEFINED CMAKE_TOOLCHAIN_FILE)
            if(DEFINED ENV{VITASDK})
              set(CMAKE_TOOLCHAIN_FILE "$ENV{VITASDK}/share/vita.toolchain.cmake" CACHE PATH "Vita toolchain")
            else()
              message(FATAL_ERROR "VITASDK is required")
            endif()
          endif()
          project(vita_vpk_probe C)
          include("$ENV{VITASDK}/share/vita.cmake" REQUIRED)
          set(VITA_APP_NAME "ICO Vita SDK Probe")
          set(VITA_TITLEID "VPRB00001")
          set(VITA_VERSION "01.00")
          add_executable(vita_vpk_probe main.c)
          vita_create_self(vita_vpk_probe.self vita_vpk_probe)
          vita_create_vpk(vita_vpk_probe.vpk ${VITA_TITLEID} vita_vpk_probe.self
            VERSION ${VITA_VERSION}
            NAME ${VITA_APP_NAME}
          )
          EOF
          cmake -S "$probe" -B "$probe/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$probe/build" --parallel 2
          self="$probe/build/vita_vpk_probe.self"
          vpk="$probe/build/vita_vpk_probe.vpk"
          test -s "$self"
          test -s "$vpk"
          file "$self" "$vpk"
          python3 - "$vpk" <<'PY'
          import sys
          import zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as package:
              bad = package.testzip()
              if bad is not None:
                  raise SystemExit(f"corrupt VPK member: {bad}")
              names = package.namelist()
              if "eboot.bin" not in names or "sce_sys/param.sfo" not in names:
                  raise SystemExit(f"required VPK members missing: {names}")
              print("VPK archive verified:", ", ".join(names))
          PY

      - name: Upload minimal SDK smoke-test package
        uses: actions/upload-artifact@v4
        with:
          name: vita-sdk-smoke-probe-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vita-vpk-probe/build/vita_vpk_probe.self
            ${{ runner.temp }}/vita-vpk-probe/build/vita_vpk_probe.vpk
          retention-days: 7
          if-no-files-found: error

      - name: Cross-compile CPU-side renderer references
        shell: bash
        run: |
          set -euo pipefail
          cc="$VITASDK/bin/arm-vita-eabi-gcc"
          root="$GITHUB_WORKSPACE"
          for source in vu1_ref.c vu1_normal.c vu1_scissor.c vu1_cluster.c vu1_mesh.c vu1_particle.c; do
            object="$RUNNER_TEMP/ico_vu1_${source%.c}_vita.o"
            "$cc" -std=gnu11 -Wall -Wextra -Werror -O2 \
              -fno-strict-aliasing -ffp-contract=off -fno-fast-math \
              -I "$root/port/math" \
              -I "$root/port/render/vu1_ref" \
              -c "$root/port/render/vu1_ref/$source" -o "$object"
            header="$("$VITASDK/bin/arm-vita-eabi-readelf" -h "$object")"
            grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
            grep -Eq 'Machine:[[:space:]]+ARM' <<< "$header"
            printf 'Verified ARMv7 CPU renderer object: %s\n' "$object"
          done
          for source in xxh3.c texpack_name.c; do
            object="$RUNNER_TEMP/ico_render_${source%.c}_vita.o"
            "$cc" -std=gnu11 -Wall -Wextra -Werror -O2 \
              -fno-strict-aliasing -ffp-contract=off -fno-fast-math \
              -I "$root/port/math" \
              -I "$root/port/render" \
              -c "$root/port/render/$source" -o "$object"
            header="$("$VITASDK/bin/arm-vita-eabi-readelf" -h "$object")"
            grep -Eq 'Class:[[:space:]]+ELF32' <<< "$header"
            grep -Eq 'Machine:[[:space:]]+ARM' <<< "$header"
            printf 'Verified ARMv7 render support object: %s\n' "$object"
          done

  softdouble-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure isolated host regression test
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/ico-softdouble-project"
          mkdir -p "$project"
          cat > "$project/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.25)
          project(ico_softdouble_regression C)
          enable_testing()
          set(ICO_ROOT "" CACHE PATH "ICO repository root")
          set(dpbit "${CMAKE_CURRENT_BINARY_DIR}/dpbit")
          add_custom_command(
            OUTPUT "${dpbit}/dp-bit.c" "${dpbit}/fp-bit.c" "${dpbit}/libgcc2.h"
            COMMAND "${CMAKE_COMMAND}" "-DSRC=${ICO_ROOT}/sce/libgcc" "-DDST=${dpbit}"
                    -P "${ICO_ROOT}/port/math/test/dpbit_harness.cmake"
            DEPENDS "${ICO_ROOT}/sce/libgcc/dp-bit.c" "${ICO_ROOT}/sce/libgcc/fp-bit.c"
                    "${ICO_ROOT}/sce/libgcc/libgcc2.h"
                    "${ICO_ROOT}/port/math/test/dpbit_harness.cmake"
            VERBATIM)
          add_library(ico_dpbit_ref STATIC "${dpbit}/dp-bit.c" "${dpbit}/fp-bit.c")
          target_compile_definitions(ico_dpbit_ref PRIVATE
            dpadd=ref_dpadd dpsub=ref_dpsub dpmul=ref_dpmul dpdiv=ref_dpdiv dpcmp=ref_dpcmp
            litodp=ref_litodp dptoli=ref_dptoli dptoul=ref_dptoul __negdf2=ref___negdf2
            __make_dp=ref___make_dp dptofp=ref_dptofp __pack_d=ref___pack_d
            __unpack_d=ref___unpack_d _fpadd_parts=ref__fpadd_parts
            __fpcmp_parts_d=ref___fpcmp_parts_d fpadd=ref_fpadd fpsub=ref_fpsub
            fpmul=ref_fpmul fpdiv=ref_fpdiv fpcmp=ref_fpcmp sitofp=ref_sitofp
            fptosi=ref_fptosi fptoui=ref_fptoui __negsf2=ref___negsf2
            __make_fp=ref___make_fp fptodp=ref_fptodp __pack_f=ref___pack_f
            __unpack_f=ref___unpack_f __fpcmp_parts_f=ref___fpcmp_parts_f)
          target_compile_options(ico_dpbit_ref PRIVATE -w -fno-builtin -fno-strict-aliasing)
          add_executable(softdouble_test
            "${ICO_ROOT}/port/math/softdouble.c"
            "${ICO_ROOT}/port/math/test/softdouble_test.c")
          target_include_directories(softdouble_test PRIVATE "${ICO_ROOT}/port/math")
          target_compile_options(softdouble_test PRIVATE -std=gnu11 -fno-strict-aliasing
            -fwrapv -ffp-contract=off -fno-fast-math -fsigned-char -fno-common -fgnu89-inline)
          target_link_libraries(softdouble_test PRIVATE ico_dpbit_ref m)
          add_test(NAME softdouble COMMAND softdouble_test)
          EOF
          cmake -S "$project" -B "$project/build" -G Ninja -DICO_ROOT="$GITHUB_WORKSPACE"

      - name: Build and run bit-exact softdouble regression
        run: |
          cmake --build "$RUNNER_TEMP/ico-softdouble-project/build" --target softdouble_test --parallel 2
          ctest --test-dir "$RUNNER_TEMP/ico-softdouble-project/build" --output-on-failure -R softdouble


  game-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4

      - name: Cross-compile every host game translation unit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/vita_source_audit.py \
            --root "$GITHUB_WORKSPACE" \
            --cc "$VITASDK/bin/arm-vita-eabi-gcc" \
            --output-dir "$RUNNER_TEMP/vita-game-objects" \
            --report "$RUNNER_TEMP/vita-source-audit.json"

      - name: Upload source-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vita-game-source-audit
          path: ${{ runner.temp }}/vita-source-audit.json
          retention-days: 7
          if-no-files-found: warn
